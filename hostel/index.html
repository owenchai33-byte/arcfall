<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#008069">

<style>
/* Layout: a WhatsApp-style chat (left) where Wilson taps reply buttons, and the live dashboard it feeds (right).
   Under 900px the chat fills the screen and the dashboard slides in from the chat header or a link in a message. */
:root{
  --page:#e8e2d6; --ink:#1c232e; --muted:#5f6672; --card:#ffffff; --line:#e6ddcf;
  --accent:#c9581a; --accent-soft:#fbe5d4; --blue:#2c5c8f; --blue-soft:#dfe9f5; --green:#2d7a4c; --green-soft:#dcefe3; --violet:#6a4c9c; --violet-soft:#ece5f7;
  --wa-head:#008069; --wa-head-ink:#ffffff; --wa-bg:#efeae2; --wa-in:#ffffff; --wa-out:#d9fdd3; --wa-text:#111b21; --wa-meta:#667781;
  --wa-tick:#53bdeb; --wa-btn:#027eb5; --wa-bar:#f0f2f5; --wa-field:#ffffff; --wa-send:#00a884; --wa-notice:#ffeecd; --wa-notice-ink:#54656f;
  --wa-day:#ffffff; --wa-dot:rgba(0,0,0,.045); --wa-line:rgba(11,20,26,.1); --frame:#16191d;
  --f-display:"Bricolage Grotesque","Atkinson Hyperlegible Next",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible Next",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --f-chat:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0d1013; --ink:#e9edef; --muted:#a3abb5; --card:#171c21; --line:#29313a;
  --accent:#f08a43; --accent-soft:#3a2617; --blue:#90bbea; --blue-soft:#1b2a3c; --green:#72d19b; --green-soft:#173326; --violet:#c2a8f0; --violet-soft:#2a2140;
  --wa-head:#202c33; --wa-head-ink:#e9edef; --wa-bg:#0b141a; --wa-in:#202c33; --wa-out:#005c4b; --wa-text:#e9edef; --wa-meta:#8696a0;
  --wa-btn:#53bdeb; --wa-bar:#202c33; --wa-field:#2a3942; --wa-notice:#182229; --wa-notice-ink:#ffd279; --wa-day:#182229; --wa-dot:rgba(255,255,255,.025); --wa-line:rgba(255,255,255,.09); --frame:#000;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0d1013; --ink:#e9edef; --muted:#a3abb5; --card:#171c21; --line:#29313a;
  --accent:#f08a43; --accent-soft:#3a2617; --blue:#90bbea; --blue-soft:#1b2a3c; --green:#72d19b; --green-soft:#173326; --violet:#c2a8f0; --violet-soft:#2a2140;
  --wa-head:#202c33; --wa-head-ink:#e9edef; --wa-bg:#0b141a; --wa-in:#202c33; --wa-out:#005c4b; --wa-text:#e9edef; --wa-meta:#8696a0;
  --wa-btn:#53bdeb; --wa-bar:#202c33; --wa-field:#2a3942; --wa-notice:#182229; --wa-notice-ink:#ffd279; --wa-day:#182229; --wa-dot:rgba(255,255,255,.025); --wa-line:rgba(255,255,255,.09); --frame:#000;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

.top{max-width:1120px;margin:0 auto;padding:20px 24px 14px;display:flex;align-items:center;gap:14px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;flex:none}
.top h1{font-family:var(--f-display);font-size:22px;line-height:1.1;margin:0}
.top p{margin:2px 0 0;color:var(--muted);font-size:15px}
.ghost{margin-left:auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 28px;display:grid;grid-template-columns:400px minmax(0,1fr);gap:28px;align-items:start}

/* ---------- phone / chat ---------- */
.phone{height:min(800px,calc(100vh - 110px));min-height:600px;border:10px solid var(--frame);border-radius:38px;background:var(--wa-bg);overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 30px 70px -30px rgba(20,15,5,.55);font-family:var(--f-chat)}
.wa-h{display:flex;align-items:center;gap:10px;background:var(--wa-head);color:var(--wa-head-ink);padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top,0px));flex:none}
.wa-av{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none;font-family:var(--f-display)}
.wa-who{min-width:0;flex:1}
.wa-who b{display:block;font-size:16.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-who small{display:block;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-ic{border:0;background:none;color:inherit;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.wa-ic svg{width:23px;height:23px}
.wa-ic .dot{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:#ff5a4f;border:2px solid var(--wa-head)}
.dash-btn{display:none}
.wa-lang{border:1.5px solid currentColor;background:none;color:inherit;border-radius:999px;padding:4px 11px;font-size:13.5px;font-weight:700;cursor:pointer;flex:none;opacity:.95}
.chat{flex:1;overflow-y:auto;padding:10px 12px 14px;display:flex;flex-direction:column;gap:3px;background-color:var(--wa-bg);background-image:radial-gradient(var(--wa-dot) 1.3px,transparent 1.4px);background-size:20px 20px;scroll-behavior:smooth;min-height:0}
.notice{align-self:center;background:var(--wa-notice);color:var(--wa-notice-ink);font-size:13px;line-height:1.35;border-radius:8px;padding:6px 11px;text-align:center;max-width:90%;margin:4px 0 8px}
.day{align-self:center;background:var(--wa-day);color:var(--wa-meta);font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:8px;margin:10px 0 6px;letter-spacing:.03em;box-shadow:0 1px .5px rgba(11,20,26,.13)}
.msg{display:flex}
.msg.me{justify-content:flex-end}
.msg.tail{margin-top:6px}
.bub{max-width:86%;background:var(--wa-in);color:var(--wa-text);border-radius:9px;padding:6px 9px 7px 10px;box-shadow:0 1px .5px rgba(11,20,26,.13);font-size:16px;line-height:1.4;position:relative;min-width:84px}
.me .bub{background:var(--wa-out)}
.tail.bot .bub{border-top-left-radius:0}
.tail.me .bub{border-top-right-radius:0}
.tail.bot .bub::before,.tail.me .bub::before{content:"";position:absolute;top:0;width:9px;height:12px;background:inherit}
.tail.bot .bub::before{left:-8px;clip-path:polygon(0 0,100% 0,100% 100%)}
.tail.me .bub::before{right:-8px;clip-path:polygon(0 0,100% 0,0 100%)}
.tx{white-space:pre-wrap;overflow-wrap:anywhere}
.meta{float:right;margin:8px 0 -5px 12px;font-size:11.5px;color:var(--wa-meta);display:inline-flex;gap:3px;align-items:center;line-height:1}
.meta svg{width:16px;height:11px;color:var(--wa-tick)}
.fwd{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--wa-meta);font-style:italic;margin-bottom:3px}
.fwd svg{width:14px;height:14px}
.lnk{border:0;background:none;padding:0;color:var(--wa-btn);font:inherit;font-size:15px;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.btns{margin:8px -9px -7px -10px}
.wbtn{display:flex;width:100%;justify-content:center;align-items:center;gap:7px;border:0;border-top:1px solid var(--wa-line);background:none;color:var(--wa-btn);font-family:var(--f-chat);font-weight:600;font-size:15.5px;padding:11px 10px;cursor:pointer;border-radius:0}
.wbtn:last-child{border-radius:0 0 9px 9px}
.wbtn svg{width:16px;height:16px;flex:none}
.wbtn:disabled{color:var(--wa-meta);cursor:default;opacity:.7}
.wbtn.go{animation:glow 1.8s ease-in-out 3}
@keyframes glow{0%,100%{background:transparent}50%{background:rgba(2,126,181,.1)}}
.msg.in{animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.typing .bub{display:flex;gap:4px;padding:12px 14px;min-width:0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--wa-meta);opacity:.5;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.wa-in{display:flex;gap:8px;align-items:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--wa-bar);flex:none}
.wa-field{flex:1;display:flex;align-items:center;gap:8px;background:var(--wa-field);border-radius:22px;padding:0 14px;min-width:0}
.wa-field span{color:var(--wa-meta);font-size:20px;line-height:1}
.wa-field input{flex:1;border:0;background:none;color:var(--wa-text);font:inherit;font-size:16px;padding:11px 0;outline:none;min-width:0;font-family:var(--f-chat)}
.wa-send{width:46px;height:46px;border-radius:50%;border:0;background:var(--wa-send);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.wa-send svg{width:22px;height:22px}
.toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:rgba(17,27,33,.92);color:#fff;padding:10px 14px;border-radius:12px;font-size:14px;width:max-content;max-width:88%;text-align:center;z-index:30;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* tenant's own chat, opened from a message */
.ali{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--wa-bg);transform:translateX(102%);transition:transform .25s ease,visibility 0s .25s;visibility:hidden}
.ali.open{transform:none;visibility:visible;transition:transform .25s ease}

/* ---------- dashboard ---------- */
.dash{background:var(--card);border:1px solid var(--line);border-radius:26px;height:min(800px,calc(100vh - 110px));min-height:600px;overflow-y:auto;padding:22px 24px 26px;box-shadow:0 30px 70px -40px rgba(20,15,5,.45)}
.dash.pulse{animation:dpulse 1s ease-out}
@keyframes dpulse{0%{box-shadow:0 0 0 0 rgba(201,88,26,.3)}100%{box-shadow:0 0 0 10px rgba(201,88,26,0)}}
.dh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dh h2{font-family:var(--f-display);font-size:28px;line-height:1.05;margin:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--green);background:var(--green-soft);padding:4px 10px;border-radius:999px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green);animation:lv 1.6s infinite}
@keyframes lv{50%{opacity:.35}}
.back{display:none;border:0;background:none;color:var(--ink);font-weight:700;font-size:16px;padding:6px 8px 10px 0;cursor:pointer}
.dsub{color:var(--muted);font-size:14px;margin:4px 0 0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 20px}
.tile{border-radius:18px;padding:13px 14px 12px}
.tile .n{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;display:block}
.tile .l{font-size:14px;font-weight:700;color:var(--ink);display:block;margin-top:4px;line-height:1.2}
.tile.want{background:var(--accent-soft)}.tile.want .n{color:var(--accent)}
.tile.need{background:var(--blue-soft)}.tile.need .n{color:var(--blue)}
.tile.done{background:var(--green-soft)}.tile.done .n{color:var(--green)}
.tile.bump .n{animation:bump .6s ease-out}
@keyframes bump{40%{transform:scale(1.22)}}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.col h3{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;margin:0 -6px;border-bottom:1px solid var(--line);border-radius:10px}
.item:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--accent)}
.av.b{border-radius:12px;background:var(--blue-soft);color:var(--blue)}
.item b{display:block;font-size:15.5px;line-height:1.25}
.item small{display:block;color:var(--muted);font-size:13.5px;line-height:1.3}
.tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag.o{background:var(--accent-soft);color:var(--accent)}.tag.b{background:var(--blue-soft);color:var(--blue)}.tag.g{background:var(--green-soft);color:var(--green)}.tag.v{background:var(--violet-soft);color:var(--violet)}
.item.flash{animation:flash 2.6s ease-out}
@keyframes flash{0%,30%{background:var(--accent-soft)}100%{background:transparent}}
.restart2{display:none;margin:22px auto 0;border:0;background:none;color:var(--muted);text-decoration:underline;font-size:14px;cursor:pointer}

@media (max-width:1080px){.cols{grid-template-columns:1fr}}
@media (max-width:899px){
  .top{display:none}
  .wrap{display:block;padding:0}
  .phone{height:100vh;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}
  .dash-btn{display:grid}
  .dash{position:fixed;inset:0;z-index:40;height:auto;min-height:0;border:0;border-radius:0;box-shadow:none;transform:translateX(102%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s;padding:12px 16px calc(24px + env(safe-area-inset-bottom,0px))}
  .dash.open{transform:none;visibility:visible;transition:transform .25s ease}
  .back{display:inline-flex}
  .tiles{gap:8px}
  .tile{padding:11px 11px 10px}
  .tile .n{font-size:36px}
  .tile .l{font-size:13px}
  .restart2{display:block}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.ghost:focus-visible,.wbtn:focus-visible,.lnk:focus-visible,.wa-ic:focus-visible,.wa-lang:focus-visible,.wa-send:focus-visible,.back:focus-visible,.restart2:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>

<header class="top">
  <div class="logo">HH</div>
  <div><h1 data-t="title"></h1><p data-t="pageSub"></p></div>
  <button type="button" class="ghost" data-restart data-t="restart"></button>
</header>

<div class="wrap">
  <main class="phone" id="phone">
    <header class="wa-h">
      <div class="wa-av">HH</div>
      <div class="wa-who"><b data-t="assistant"></b><small id="status"></small></div>
      <button type="button" class="wa-ic dash-btn" id="dashBtn" aria-label="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="dot" id="dashDot" hidden></span></button>
      <button type="button" class="wa-lang" id="langBtn"></button>
    </header>
    <div class="chat" id="chat" role="log" aria-live="polite"></div>
    <form class="wa-in" id="form" autocomplete="off">
      <label class="wa-field"><span aria-hidden="true">☺</span><input id="txt" aria-label="Message"></label>
      <button class="wa-send" aria-label="Send"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6l-.01 6.53L15 12 3.39 13.87z"/></svg></button>
    </form>

    <section class="ali" id="ali" aria-label="Tenant chat">
      <header class="wa-h">
        <button type="button" class="wa-ic" data-close="ali" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <div class="wa-av">W</div>
        <div class="wa-who"><b>Wilson's Hostel</b><small data-t="aliSees"></small></div>
      </header>
      <div class="chat" id="aliChat"></div>
    </section>
  </main>

  <aside class="dash" id="dash" aria-label="Dashboard"></aside>
</div>

<script>

 btn_tenant:'🏠 新租客入住',btn_boss:'👷 有老板要请人',btn_check:'💬 每月问候',btn_post:'↪ 转发请人贴文',btn_yes:'✅ 好，发给老板',btn_no:'先不要',btn_sendwa:'📤 用我的 WhatsApp 发送',btn_again:'🔁 重新开始',
 m_tenant:'新租客 🏠\nAli bin Ahmad，011-2000 3456\nH07 Batu Kawa，床位 2B，月租 RM250\n现在做杂工',
 b_saved:'已保存 ✓ Ali 住 H07 Batu Kawa。\n我现在 WhatsApp 问 Ali 的工作经验 💬',
 b_ali:'*Ali 回复了 ✓*\n做过：{jobs}\n想换工：想，工资高就换\n可在马来西亚工作：可以，本地人\n\n已加入「谁在找工」✓',
 seeAli:'👀 看 Ali 的聊天',seeDash:'📊 看后台',
 m_boss:"Lee's Kopitiam 要请 2 个杂工，在 Batu Kawa，星期一开工，RM1,800。",
 b_asking:'收到 👍 我问了 {n} 位会做杂工的租客。',
 b_yes:"*{n} 人说可以 ✓*\n{list}\n\n要发给 Lee's Kopitiam 吗？",
 m_yes:'好，发给老板',m_no:'先不要',
 b_sent:"已发送 ✓ Lee's Kopitiam 已在 WhatsApp 收到他们的资料。\n星期一我会问谁上工了。",
 day_mon:'星期一',and:' 和 ',
 b_started:"{names} 已经在 Lee's Kopitiam 上工了 🎉\n床位保住，租金也稳了。",
 b_notnow:'好，我先把他们留在名单上。',
 m_check:'发每月问候',
 b_checkSent:'正在发给 {n} 位已同意的租客 💬\n「最近工作怎样？想换工吗？有朋友在找工作吗？」',
 b_checkReplies:'*目前的回复：*\n• {a} 想换工作 → 已加入\n• {b} 的朋友 {c} 在找工 → 已加入\n• 其他 {d} 人：一切都好 👍',
 b_post:'*收到 ✓ Kedai Tayar Ah Seng* 要请 2 个杂工，在 Batu Kawa。\n有 {n} 位租客适合。\n\nWhatsApp 不允许我先联络店家，所以我帮你写好了，你按发送就好 👇\n\n_{msg}_',
 shopMsg:'老板你好，看到你在请杂工。我们有住在 Batu Kawa 附近的工人，随时可以开工。可以发资料给你吗？– Wilson',
 toastWa:'真机上会打开和店家的 WhatsApp，信息已经写好。',
 b_postSent:'好。他们回复后转发给我，我会把租客资料发给他们。',
 b_end:'这就是整个系统 🙌\n租客入住、每月问候、帮老板找工人，全部在 WhatsApp 里完成。后台随时看到最新情况。',
 fallback:'我可以帮你处理：新租客、老板请人、每月问候。按下面的按钮 👇',
 aliSees:'Ali 手机上看到的',
 dashTitle:'后台',live:'实时',dsub:'Wilson 的宿舍，助理自动更新',back:'‹ 回到聊天',
 tWant:'想找工',tNeed:'要请人',tDone:'本月已上工',
 cWant:'谁在找工',cNeed:'谁在请人',
 gNew:'新',gLook:'找工中',gSent:'已发给老板',gFilled:'已请满 ✓',gLead:'请人贴文',gMsg:'已联络 ✓',gFound:'已找到 {a}/{b}',
 friendOf:'{n} 的朋友',needs:'{j} × {c}'}
};
const JOBS={gw:{en:'General worker',zh:'杂工'},construction:{en:'Construction',zh:'建筑工'},kitchen:{en:'Kitchen',zh:'厨房'},cleaner:{en:'Cleaner',zh:'清洁工'},driver:{en:'Driver',zh:'司机'},security:{en:'Security',zh:'保安'},shop:{en:'Shop helper',zh:'店员'},factory:{en:'Factory',zh:'工厂'}};
const POST="KAMI SEDANG MENGAMBIL PEKERJA! 📢\nKedai Tayar Ah Seng, Batu Kawa\nPerlu 2 orang pekerja am\nGaji RM1,700 + OT\nWhatsApp 012-889 2301";
const ALI_CHAT=[
 ['in',"Hi Ali! 👋 Welcome to Wilson's Hostel 🏠\nI can help you find work while you stay with us.\nType STAFF anytime to talk to a person.\nEnglish / Bahasa / 中文?"],['out','Bahasa'],
 ['in','Boleh kami kongsi profil kerja awak dengan bos yang cari pekerja? Taip STOP bila-bila masa.'],['out','Ya, boleh'],
 ['in','Kerja apa yang awak pernah buat?'],['out','Pekerja am, pembinaan'],
 ['in','Awak warganegara Malaysia, atau ada permit kerja?'],['out','Warganegara Malaysia'],
 ['in','Awak nak cari kerja baru sekarang?'],['out','Ya, kalau gaji lebih'],
 ['in','Terima kasih Ali! ✓ Saya akan mesej bila ada bos berdekatan cari pekerja.']];

let lang=(navigator.language||'').startsWith('zh')?'zh':'en';
try{lang=localStorage.getItem('hh3-lang')||lang}catch(e){}
const t=(k,v={})=>{const s=L[lang][k]??L.en[k]??k;return s.replace(/\{(\w+)\}/g,(_,x)=>v[x]??'')};
const jl=ks=>ks.map(k=>JOBS[k][lang]).join(', ');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/(^|\n)_([^_]+)_/g,'$1<i>$2</i>');
const first=n=>n.split(' ')[0];
const ini=n=>n.split(/\s+/).filter(w=>/^[A-Za-z]/.test(w)&&!/^(anak|bin|binti)$/i.test(w)).slice(0,2).map(w=>w[0].toUpperCase()).join('');
const $=s=>document.querySelector(s);
const mobile=()=>matchMedia('(max-width:899px)').matches;
const ICON={reply:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
 ticks:'<svg viewBox="0 0 16 11" fill="currentColor"><path d="M11.07.65 4.6 7.1 2.2 4.73 1 5.9l3.6 3.55L12.25 1.8zM15 .65 8.53 7.1l-.7-.7-1.18 1.17 1.88 1.88L16.18 1.8z"/></svg>',
 fwd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5V20"/></svg>'};

/* ---------- state (fresh on every load: it's a demo) ---------- */
let S,seq=0,tick=0,busy=false,gen=0;const FLASH=new Set();
function seed(){
  const T=(id,name,hostel,jobs,status)=>({id,name,hostel,jobs,status,ts:++tick});
  return{msgs:[],done:{},started:5,pending:[],
    tenants:[T('rizal','Rizal Hamdan','H07 Batu Kawa',['gw','cleaner'],'working'),T('peter','Peter Ngau','H25 Petra Jaya',['factory','gw'],'working'),
      T('budi','Budi Santoso','H21 Matang',['construction','gw'],'matched'),T('lina','Lina Tan','H12 Padungan',['kitchen','shop'],'looking'),
      T('keong','Ah Keong','H33 Stutong',['kitchen'],'looking'),T('dennis','Dennis Jugah','H07 Batu Kawa',['security','gw'],'looking'),
      T('faizal','Mohd Faizal','H18 Tabuan Jaya',['driver','gw'],'looking'),T('siti','Siti Aminah','H03 Padungan',['kitchen','cleaner'],'looking'),
      T('jimmy','Jimmy anak Lawai','H07 Batu Kawa',['gw','construction'],'looking')],
    bosses:[{id:'hw',name:'Hardware shop, Matang',job:'gw',count:2,area:'Matang',found:1,state:'open',ts:++tick}]};
}
const ten=id=>S.tenants.find(x=>x.id===id),boss=id=>S.bosses.find(x=>x.id===id);
const touch=x=>{x.ts=++tick;FLASH.add(x.id);return x};

/* ---------- chat ---------- */
const chat=$('#chat');
const dashLink=()=>`<div class="links"><button type="button" class="lnk" data-open="dash">${esc(t('seeDash'))}</button></div>`;
const MSG={
  raw:v=>esc(v.s),
  b_ali:v=>fmt(t('b_ali',{jobs:jl(v.jobs)}))+`<div class="links"><button type="button" class="lnk" data-open="ali">${esc(t('seeAli'))}</button><button type="button" class="lnk" data-open="dash">${esc(t('seeDash'))}</button></div>`,
  b_yes:v=>fmt(t('b_yes',{n:v.people.length,list:v.people.map((p,i)=>`${i+1}. ${p.name}\n    ${p.hostel} · ${jl(p.jobs)}`).join('\n')})),
  b_started:v=>fmt(t('b_started',{names:v.names.join(t('and'))}))+dashLink(),
  b_checkReplies:v=>fmt(t('b_checkReplies',v))+dashLink(),
  b_post:v=>fmt(t('b_post',{n:v.n,msg:t('shopMsg')})),
  m_post:()=>esc(POST)
};
const clock=()=>new Date().toTimeString().slice(0,5);
function msgEl(m,anim){
  const d=document.createElement('div');
  if(m.who==='notice'){d.className='notice';d.textContent=t('notice');return d}
  if(m.who==='day'){d.className='day';d.textContent=t(m.k).toUpperCase();return d}
  const i=S.msgs.indexOf(m),prev=S.msgs[i-1];
  d.className='msg '+m.who+(!prev||prev.who!==m.who?' tail':'')+(anim?' in':'');
  const body=(MSG[m.k]||(v=>fmt(t(m.k,v))))(m.v||{});
  const btns=(m.btns||[]).map(b=>`<button type="button" class="wbtn" data-b="${b}" data-m="${m.id}">${ICON.reply}${esc(t('btn_'+b))}</button>`).join('');
  d.innerHTML=`<div class="bub">${m.fwd?`<div class="fwd">${ICON.fwd}${esc(t('forwarded'))}</div>`:''}<div class="tx">${body}<span class="meta">${m.time}${m.who==='me'?ICON.ticks:''}</span></div>${btns?`<div class="btns">${btns}</div>`:''}</div>`;
  return d;
}
function add(m){m.id=++seq;m.time=clock();S.msgs.push(m);chat.appendChild(msgEl(m,true));refreshBtns();toEnd()}
function toEnd(){requestAnimationFrame(()=>{chat.scrollTop=chat.scrollHeight})}
function renderChat(){chat.innerHTML='';S.msgs.forEach(m=>chat.appendChild(msgEl(m,false)));if(busy)showTyping(true);refreshBtns();chat.style.scrollBehavior='auto';chat.scrollTop=chat.scrollHeight;chat.style.scrollBehavior=''}
const liveMsg=()=>[...S.msgs].reverse().find(m=>m.btns&&m.btns.length);
function refreshBtns(){
  const live=liveMsg(),firstLive=live&&chat.querySelector(`.wbtn[data-m="${live.id}"]`);
  chat.querySelectorAll('.wbtn').forEach(b=>{const ok=!busy&&live&&!live.used&&+b.dataset.m===live.id;b.disabled=!ok;b.classList.toggle('go',!!ok&&b===firstLive)});
}
function showTyping(on){
  $('#status').textContent=t(on?'typing':'online');
  chat.querySelectorAll('.typing').forEach(x=>x.remove());
  if(on){const d=document.createElement('div');d.className='msg bot typing';d.innerHTML='<div class="bub"><i></i><i></i><i></i></div>';chat.appendChild(d);toEnd()}
}
const sleep=ms=>{const g=gen;return new Promise((ok,no)=>setTimeout(()=>g===gen?ok():no('restart'),ms))};
const me=(k,typed,extra={})=>add(typed?{who:'me',k:'raw',v:{s:typed}}:{who:'me',k,...extra});
async function bot(k,v,btns,ms){showTyping(true);await sleep(ms);showTyping(false);add({who:'bot',k,v,btns})}
const nextBtns=()=>['tenant','boss','check','post'].filter(k=>!S.done[k]).slice(0,3);

/* ---------- the demo stories ---------- */
const F={
  async tenant(s){S.done.tenant=true;me('m_tenant',s);
    await bot('b_saved',{},null,1000);
    await bot('b_ali',{jobs:['gw','construction']},nextBtns(),2600);
    change(()=>{S.tenants.push(touch({id:'ali',name:'Ali bin Ahmad',hostel:'H07 Batu Kawa',jobs:['gw','construction'],status:'looking',fresh:true}))})},
  async boss(s){S.done.boss=true;me('m_boss',s);
    const fit=S.tenants.filter(x=>x.status==='looking'&&x.jobs.includes('gw'));
    change(()=>{S.bosses.push(touch({id:'lee',name:"Lee's Kopitiam",job:'gw',count:2,area:'Batu Kawa',found:0,state:'open'}))});
    await bot('b_asking',{n:fit.length},null,1000);
    const near=fit.sort((a,b)=>(b.hostel.includes('Batu Kawa')-a.hostel.includes('Batu Kawa'))||((b.id==='ali')-(a.id==='ali'))||((b.jobs[0]==='gw')-(a.jobs[0]==='gw'))).slice(0,2);
    S.pending=near.map(x=>x.id);
    await bot('b_yes',{people:near.map(x=>({name:x.name,hostel:x.hostel,jobs:x.jobs}))},['yes','no'],2200);
    change(()=>{touch(boss('lee')).found=near.length})},
  async yes(s){me('m_yes',s);const ids=S.pending;
    change(()=>{ids.forEach(id=>{touch(ten(id)).status='matched'});touch(boss('lee')).state='sent'});
    await bot('b_sent',{},null,1000);
    await sleep(1100);add({who:'day',k:'day_mon'});
    await bot('b_started',{names:ids.map(id=>first(ten(id).name))},nextBtns(),1300);
    change(()=>{ids.forEach(id=>{const x=ten(id);x.status='working';x.fresh=false});S.started+=ids.length;touch(boss('lee')).state='filled'})},
  async no(s){me('m_no',s);await bot('b_notnow',{},nextBtns(),900)},
  async check(s){S.done.check=true;me('m_check',s);
    await bot('b_checkSent',{n:48},null,1000);
    await bot('b_checkReplies',{a:'Rizal Hamdan',b:'Peter Ngau',c:'Joseph Nyaru',d:21},nextBtns(),2600);
    change(()=>{touch(ten('rizal')).status='looking';S.tenants.push(touch({id:'joseph',name:'Joseph Nyaru',hostel:'',friendOf:'Peter',jobs:['factory','gw'],status:'looking',fresh:true}))})},
  async post(s){S.done.post=true;
    if(s)me(null,s);else add({who:'me',k:'m_post',fwd:true});
    change(()=>{S.bosses.push(touch({id:'tyre',name:'Kedai Tayar Ah Seng',job:'gw',count:2,area:'Batu Kawa',state:'lead'}))});
    await bot('b_post',{n:S.tenants.filter(x=>x.status==='looking'&&x.jobs.includes('gw')).length},['sendwa'],1700)},
  async sendwa(){toast(t('toastWa'));change(()=>{touch(boss('tyre')).state='messaged'});await bot('b_postSent',{},nextBtns(),1300)},
  async free(s){me(null,s);await bot('fallback',{},nextBtns().length?nextBtns():['again'],900)}
};
async function run(k,s){
  if(busy)return;
  if(k==='again'){restart();return}
  busy=true;refreshBtns();
  try{
    await F[k](s);
    const last=S.msgs[S.msgs.length-1];
    if(['tenant','boss','check','post'].every(x=>S.done[x])&&!(last.btns&&last.btns.length)&&!S.ended){S.ended=true;await bot('b_end',{},['again'],1300)}
  }catch(e){if(e!=='restart')throw e}
  busy=false;refreshBtns();
}
chat.addEventListener('click',e=>{
  const b=e.target.closest('.wbtn');
  if(b&&!b.disabled){const m=S.msgs.find(x=>x.id===+b.dataset.m);m.used=true;run(b.dataset.b);return}
  const o=e.target.closest('[data-open]');if(o)openPanel(o.dataset.open);
});
$('#form').addEventListener('submit',e=>{
  e.preventDefault();const inp=$('#txt'),s=inp.value.trim();if(!s||busy)return;inp.value='';
  const l=s.toLowerCase(),live=liveMsg(),open=live&&!live.used?live:null;
  if(open&&open.btns.includes('yes')){
    if(/^(yes|ya|ok|okay|好|可以|send)/.test(l)){open.used=true;run('yes',s);return}
    if(/^(no|not|tak|tidak|不|先不要)/.test(l)){open.used=true;run('no',s);return}
  }
  let k=null;
  if(/tenant|move|入住|租客|penyewa/.test(l))k='tenant';
  else if(/check|问候|update/.test(l))k='check';
  else if(/forward|post|贴文|kami sedang|mengambil/.test(l))k='post';
  else if(/need|boss|worker|hire|hiring|请|老板|cari|pekerja/.test(l))k='boss';
  if(open)open.used=true;
  run(k&&!S.done[k]?k:'free',s);
});

/* ---------- dashboard ---------- */
const dash=$('#dash');let lastN=null;
function change(fn){fn();renderDash();if(mobile()){if(!dash.classList.contains('open'))$('#dashDot').hidden=false}else{dash.classList.remove('pulse');void dash.offsetWidth;dash.classList.add('pulse')}}
function renderDash(){
  const want=S.tenants.filter(x=>x.status==='looking'||x.status==='matched').sort((a,b)=>b.ts-a.ts);
  const bs=S.bosses.slice().sort((a,b)=>b.ts-a.ts);
  const n={want:want.length,need:S.bosses.filter(b=>b.state!=='filled').length,done:S.started};
  const tag=x=>x.status==='matched'?['b','gSent']:x.fresh?['g','gNew']:['o','gLook'];
  const btag=b=>b.state==='filled'?['g',t('gFilled')]:b.state==='sent'?['b',t('gSent')]:b.state==='lead'?['v',t('gLead')]:b.state==='messaged'?['v',t('gMsg')]:['o',t('gFound',{a:b.found,b:b.count})];
  const tile=(c,k,l)=>`<div class="tile ${c}${lastN&&lastN[k]!==n[k]?' bump':''}"><span class="n">${n[k]}</span><span class="l">${esc(t(l))}</span></div>`;
  dash.innerHTML=`<button type="button" class="back" data-close="dash">${esc(t('back'))}</button>
  <div class="dh"><h2>${esc(t('dashTitle'))}</h2><span class="live"><i></i>${esc(t('live'))}</span></div>
  <p class="dsub">${esc(t('dsub'))}</p>
  <div class="tiles">${tile('want','want','tWant')}${tile('need','need','tNeed')}${tile('done','done','tDone')}</div>
  <div class="cols">
    <section class="col"><h3>${esc(t('cWant'))}</h3>${want.map(x=>`<div class="item${FLASH.has(x.id)?' flash':''}"><span class="av">${esc(ini(x.name))}</span><span><b>${esc(x.name)}</b><small>${esc(jl(x.jobs))} · ${esc(x.friendOf?t('friendOf',{n:x.friendOf}):x.hostel)}</small></span><span class="tag ${tag(x)[0]}">${esc(t(tag(x)[1]))}</span></div>`).join('')}</section>
    <section class="col"><h3>${esc(t('cNeed'))}</h3>${bs.map(b=>`<div class="item${FLASH.has(b.id)?' flash':''}"><span class="av b">${esc(ini(b.name))}</span><span><b>${esc(b.name)}</b><small>${esc(t('needs',{j:JOBS[b.job][lang],c:b.count}))} · ${esc(b.area)}</small></span><span class="tag ${btag(b)[0]}">${esc(btag(b)[1])}</span></div>`).join('')}</section>
  </div>
  <button type="button" class="restart2" data-restart>${esc(t('restart'))}</button>`;
  lastN=n;FLASH.clear();
}
dash.addEventListener('click',e=>{if(e.target.closest('[data-close="dash"]'))closePanel('dash')});

/* ---------- panels, language, restart ---------- */
function openPanel(w){
  if(w==='ali'){$('#ali').classList.add('open');return}
  if(mobile()){dash.classList.add('open');dash.scrollTop=0;$('#dashDot').hidden=true}
  else{dash.classList.remove('pulse');void dash.offsetWidth;dash.classList.add('pulse');dash.scrollIntoView({behavior:'smooth',block:'nearest'})}
}
function closePanel(w){(w==='ali'?$('#ali'):dash).classList.remove('open')}
$('#ali').addEventListener('click',e=>{if(e.target.closest('[data-close="ali"]'))closePanel('ali')});
$('#dashBtn').onclick=()=>openPanel('dash');
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePanel('ali');closePanel('dash')}});
document.addEventListener('click',e=>{if(e.target.closest('[data-restart]'))restart()});
function renderAli(){$('#aliChat').innerHTML=ALI_CHAT.map(([d,s],i)=>`<div class="msg ${d==='in'?'bot':'me'}${!i||ALI_CHAT[i-1][0]!==d?' tail':''}"><div class="bub"><div class="tx">${esc(s)}<span class="meta">${clock()}${d==='out'?ICON.ticks:''}</span></div></div></div>`).join('')}
function applyLang(){
  document.documentElement.lang=lang==='zh'?'zh':'en';
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('#txt').placeholder=t('typeHere');$('#langBtn').textContent=t('lang');
  $('#langBtn').setAttribute('aria-label',lang==='zh'?'Switch to English':'切换到中文');
  if(!busy)$('#status').textContent=t('online');
}
$('#langBtn').onclick=()=>{lang=lang==='en'?'zh':'en';try{localStorage.setItem('hh3-lang',lang)}catch(e){}applyLang();renderChat();renderDash()};
let toastT;function toast(m){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=m;$('#phone').appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),3200)}
function restart(){
  gen++;busy=false;tick=0;seq=0;S=seed();lastN=null;FLASH.clear();
  closePanel('ali');closePanel('dash');$('#dashDot').hidden=true;
  chat.innerHTML='';showTyping(false);
  add({who:'notice'});add({who:'bot',k:'welcome',btns:['tenant','boss','check']});
  renderDash();
}
applyLang();renderAli();restart();
</script>
</body>
